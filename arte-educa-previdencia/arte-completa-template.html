<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e5e5e5; }

  :root {
    --cor-primaria: {{COR_PRIMARIA}};   /* faixa azul (topo e CTA) */
    --cor-botao: {{COR_BOTAO}};         /* botão, tom mais claro que a primária */
    --cor-moeda-ext: {{COR_MOEDA_EXT}}; /* anel da moeda */
    --cor-moeda-int: {{COR_MOEDA_INT}}; /* miolo da moeda */
    --cor-dolar: {{COR_DOLAR}};         /* símbolo $ */
    --cor-texto-corpo: #33414E;
  }

  .arte { width: 1080px; background:#fff; }

  /* ================= CABEÇALHO / LOGO ================= */
  .faixa-topo {
    background: var(--cor-primaria);
    height: 150px;
    position: relative;
  }
  .selo {
    position: absolute;
    left: 50%;
    top: 55px;
    transform: translateX(-50%);
    width: 168px;
    background: var(--cor-primaria);
    border-radius: 26px 26px 40px 40px;
    padding: 20px 14px 18px 14px;
    text-align: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    z-index: 3;
  }
  .moeda {
    width: 76px; height: 76px; margin: 0 auto 10px auto;
    border-radius: 50%; background: var(--cor-moeda-ext);
    display: flex; align-items: center; justify-content: center;
  }
  .moeda-interior {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--cor-moeda-int);
    display: flex; align-items: center; justify-content: center;
  }
  .moeda-interior span {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; color: var(--cor-dolar);
  }
  .selo-marca {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px;
    color: var(--cor-moeda-int); line-height: 1; margin-bottom: 2px;
  }
  .selo-sub {
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 12px; color: #ffffff;
  }

  /* ================= FOTO + TÍTULO ================= */
  .foto {
    width: 1080px;
    height: 770px;
    background-image: url('{{FOTO}}');
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    align-items: flex-end;
  }
  .titulo-overlay {
    position: relative;
    z-index: 2;
    padding: 0 50px 60px 50px;
    font-family: 'Baloo 2', sans-serif;
    color: #ffffff;
    font-size: 62px;
    line-height: 1.08;
    text-shadow: 0 2px 10px rgba(0,0,0,0.25);
  }
  .titulo-overlay .negrito { font-weight: 800; }
  .titulo-overlay .regular { font-weight: 500; }

  /* ================= CORPO DE TEXTO ================= */
  .corpo-secao { padding: 55px 50px 45px 50px; }
  .corpo-texto {
    font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 30px;
    line-height: 1.35; color: var(--cor-texto-corpo); margin-bottom: 34px;
  }
  .corpo-pergunta {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 32px; color: var(--cor-texto-corpo);
  }

  /* ================= CTA ================= */
  .cta-secao { background: var(--cor-primaria); padding: 50px 50px 55px 50px; }
  .cta-texto {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 32px;
    line-height: 1.3; color: #ffffff; margin-bottom: 30px;
  }
  .cta-botao {
    display: inline-block; background: var(--cor-botao); color: #ffffff;
    font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 26px;
    padding: 16px 34px; border-radius: 10px;
  }
</style>
</head>
<body>

  <div class="arte">

    <div class="faixa-topo">
      <div class="selo">
        <div class="moeda"><div class="moeda-interior"><span>$</span></div></div>
        <div class="selo-marca">{{MARCA_LINHA1}}</div>
        <div class="selo-sub">{{MARCA_LINHA2}}</div>
      </div>
    </div>

    <div class="foto">
      <div class="titulo-overlay">
        <span class="negrito">{{TITULO_NEGRITO}}</span><br>
        <span class="regular">{{TITULO_REGULAR}}</span>
      </div>
    </div>

    <div class="corpo-secao">
      <div class="corpo-texto">{{CORPO}}</div>
      <div class="corpo-pergunta">{{PERGUNTA}}</div>
    </div>

    <div class="cta-secao">
      <div class="cta-texto">{{CTA_TEXTO}}</div>
      <div class="cta-botao">{{CTA_BOTAO}}</div>
    </div>

  </div>

</body>
</html>
