<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* fontes enviadas no cadastro do cliente (vazio quando ele usa as padrão) */
  {{FONTES_CSS}}

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e5e5e5; }

  :root {
    --cor-primaria: {{COR_PRIMARIA}};   /* faixa azul (topo e CTA) */
    --cor-botao: {{COR_BOTAO}};         /* botão, tom mais claro que a primária */
    --cor-texto-corpo: #33414E;
    --fonte-titulo: {{FONTE_TITULO}};   /* título, pergunta e texto do CTA (padrão: Baloo 2) */
    --fonte-texto: {{FONTE_TEXTO}};     /* corpo e botão (padrão: Quicksand) */
  }

  .arte { width: 1080px; background:#fff; }

  /* ================= CABEÇALHO / LOGO ================= */
  .faixa-topo {
    background: var(--cor-primaria);
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .faixa-topo img {
    display: block;
    width: 380px;
    height: 120px;
    object-fit: contain;
  }

  /* ================= FOTO + TÍTULO ================= */
  .foto {
    width: 1080px;
    height: 580px;
    background-color: #cccccc;
    background-image: url('{{FOTO}}');
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    align-items: flex-end;
  }
  .foto::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(8deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 65%);
    z-index: 1;
  }
  .titulo-overlay {
    position: relative;
    z-index: 2;
    padding: 0 50px 40px 50px;
    font-family: var(--fonte-titulo);
    color: #ffffff;
    font-size: 60px;
    line-height: 1.1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.25);
  }
  .titulo-overlay .negrito { font-weight: 800; }
  .titulo-overlay .regular { font-weight: 500; }
  .titulo-overlay .linha { white-space: nowrap; } /* linhas já escolhidas por equilibrarTitulo() */

  /* ================= CORPO DE TEXTO ================= */
  .corpo-secao { padding: 55px 50px 45px 50px; }
  .corpo-texto {
    font-family: var(--fonte-texto); font-weight: 600; font-size: 30px;
    line-height: 1.35; color: var(--cor-texto-corpo); margin-bottom: 34px;
    white-space: pre-line;
  }
  .corpo-pergunta {
    font-family: var(--fonte-titulo); font-weight: 700; font-size: 32px; color: var(--cor-texto-corpo);
  }

  /* ================= CTA ================= */
  .cta-secao { background: var(--cor-primaria); padding: 50px 50px 55px 50px; }
  .cta-texto {
    font-family: var(--fonte-titulo); font-weight: 700; font-size: 32px;
    line-height: 1.3; color: #ffffff; margin-bottom: 30px;
  }
  .cta-botao {
    display: inline-block; background: var(--cor-botao); color: #ffffff;
    font-family: var(--fonte-texto); font-weight: 600; font-size: 26px;
    padding: 16px 34px; border-radius: 10px;
  }
</style>
</head>
<body>

  <div class="arte">

    <div class="faixa-topo">
      <img src="{{LOGO}}" alt="Logo" />
    </div>

    <div class="foto">
      <div class="titulo-overlay">
        <span class="negrito">{{TITULO_NEGRITO}}</span><br>
        <span class="regular">{{TITULO_REGULAR}}</span>
      </div>
    </div>

    <div class="corpo-secao">
      <div class="corpo-texto">{{CORPO}}</div>
      <div class="corpo-pergunta">{{PERGUNTA}}</div>
    </div>

    <div class="cta-secao">
      <div class="cta-texto">{{CTA_TEXTO}}</div>
      <div class="cta-botao">{{CTA_BOTAO}}</div>
    </div>

  </div>

<script>
  // Escolhe onde quebrar as linhas do título para ele ficar harmônico: linhas de tamanho parecido
  // (nunca uma linha do meio menor que as vizinhas) e a última um pouco maior, para dar hierarquia.
  // O servidor chama depois que as fontes carregam, porque a largura de cada linha depende da fonte.
  window.equilibrarTitulo = function () {
    const titulo = document.querySelector(".titulo-overlay");
    const estilo = getComputedStyle(titulo);
    // largura da foto, não do título: dentro do flex o título encolhe até o tamanho do texto
    const larguraMax = titulo.parentElement.clientWidth - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);

    // cada palavra guarda o peso (negrito ou regular); o espaço não separável de protegerOrfas fica dentro da palavra
    const palavras = [];
    for (const classe of ["negrito", "regular"]) {
      const el = titulo.querySelector("." + classe);
      for (const texto of el.textContent.trim().split(/ +/).filter(Boolean)) palavras.push({ classe, texto });
    }
    const total = palavras.length;
    if (!total) return;
    // onde termina o negrito: o normal é o regular começar numa linha nova
    const fronteira = palavras.findIndex((p) => p.classe === "regular");
    const temFronteira = fronteira > 0;

    // monta a linha [inicio, fim) com um <span> por trecho de mesmo peso
    function montarLinha(inicio, fim) {
      const linha = document.createElement("span");
      linha.className = "linha";
      let trecho = null;
      for (let i = inicio; i < fim; i++) {
        if (!trecho || trecho.className !== palavras[i].classe) {
          if (trecho) linha.appendChild(document.createTextNode(" "));
          trecho = document.createElement("span");
          trecho.className = palavras[i].classe;
          linha.appendChild(trecho);
          trecho.textContent = palavras[i].texto;
        } else {
          trecho.textContent += " " + palavras[i].texto;
        }
      }
      return linha;
    }

    const medidor = document.createElement("div");
    medidor.style.cssText = "position:absolute; visibility:hidden;";
    titulo.appendChild(medidor);
    const cache = new Map();
    function largura(inicio, fim) {
      const chave = inicio + "-" + fim;
      if (!cache.has(chave)) {
        medidor.replaceChildren(montarLinha(inicio, fim));
        cache.set(chave, medidor.firstChild.getBoundingClientRect().width / larguraMax);
      }
      return cache.get(chave);
    }

    // todas as formas de dividir as palavras [inicio, total) em `qtd` linhas que cabem na largura
    function divisoes(inicio, qtd) {
      if (qtd === 1) return largura(inicio, total) <= 1 ? [[total]] : [];
      const resultado = [];
      for (let fim = inicio + 1; fim <= total - qtd + 1; fim++) {
        if (largura(inicio, fim) > 1) break;
        for (const resto of divisoes(fim, qtd - 1)) resultado.push([fim, ...resto]);
      }
      return resultado;
    }

    // quanto menor, melhor (larguras em fração da largura disponível)
    function custo(fins) {
      const w = fins.map((fim, i) => largura(i ? fins[i - 1] : 0, fim));
      const n = w.length;
      let c = 0.04 * n; // sem motivo, não quebra em mais linhas
      if (temFronteira && !fins.includes(fronteira)) c += 0.06; // regular emendado no negrito: só se ficar bem melhor
      if (n === 1) return c;
      const ultima = w[n - 1];
      const anteriores = w.slice(0, -1);
      const maior = Math.max(...anteriores);
      const media = anteriores.reduce((a, b) => a + b, 0) / anteriores.length;
      c += 4 * anteriores.reduce((s, x) => s + (x - media) ** 2, 0); // linhas de cima parecidas entre si
      for (let i = 1; i < n - 1; i++) {
        const buraco = Math.min(w[i - 1], w[i + 1]) - w[i]; // linha do meio menor que as vizinhas
        if (buraco > 0) c += 30 * buraco ** 2 + (buraco > 0.04 ? 0.15 : 0);
      }
      if (ultima < maior) c += 10 * (maior - ultima) ** 2 + 0.05; // última menor que alguma de cima
      c += 2 * (ultima - Math.min(1, maior * 1.1)) ** 2; // ideal: última ~10% maior
      return c;
    }

    let minimo = 1;
    while (minimo <= total && !divisoes(0, minimo).length) minimo++;
    if (minimo > total) { medidor.remove(); return; } // alguma palavra não cabe sozinha: deixa como está

    let melhor = null;
    let melhorCusto = Infinity;
    for (let qtd = minimo; qtd <= Math.min(total, minimo + 2); qtd++) {
      for (const fins of divisoes(0, qtd)) {
        const c = custo(fins);
        if (c < melhorCusto) { melhorCusto = c; melhor = fins; }
      }
    }

    medidor.remove();
    titulo.replaceChildren();
    melhor.forEach((fim, i) => {
      if (i > 0) titulo.appendChild(document.createElement("br"));
      titulo.appendChild(montarLinha(i ? melhor[i - 1] : 0, fim));
    });
  };
</script>

</body>
</html>
